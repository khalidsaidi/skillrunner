name: Pages Registry
on:
  push:
    branches: [main]
    paths:
      - "registry/**"
      - "packages/registry-tools/**"
      - ".github/workflows/pages-registry.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @khalidsaidi/skillrunner-engine build
      - run: pnpm registry:build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: registry/dist
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
