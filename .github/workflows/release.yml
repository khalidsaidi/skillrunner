# SkillRunner npm release workflow (tag-driven, npm trusted publishing via OIDC — no NPM_TOKEN)
name: Release to npm on tag

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # required for npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - name: Ensure npm supports trusted publishing (>= 11.5.1)
        run: |
          npm install -g npm@latest
          npm --version
      - run: pnpm install
        env:
          CI: 'true'
      # Build order matters on a fresh checkout: registry-tools needs the
      # engine's dist, the CLI bundles registry/dist/index.json (gitignored,
      # generated by registry:build, copied by copy-bundled-registry.mjs).
      - run: pnpm --filter @khalidsaidi/skillrunner-engine build
      - run: pnpm registry:validate
      - run: pnpm registry:build
      - run: pnpm run build
      - run: pnpm run typecheck
      - run: pnpm test
      - name: Verify tag matches package version
        working-directory: packages/cli
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $PKG_VERSION" >&2
            exit 1
          fi
      - name: Publish
        working-directory: packages/cli
        run: npm publish --access public
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
