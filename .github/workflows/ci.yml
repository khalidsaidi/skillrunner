name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install
      - run: pnpm run format:check
      - run: pnpm run lint
      # Build order matters on a fresh checkout: registry-tools needs the
      # engine's dist, the CLI bundles registry/dist/index.json (gitignored,
      # generated by registry:build).
      - run: pnpm --filter @khalidsaidi/skillrunner-engine build
      - run: pnpm registry:validate
      - run: pnpm registry:build
      - run: pnpm run build
      - run: pnpm run typecheck
      - run: pnpm test
